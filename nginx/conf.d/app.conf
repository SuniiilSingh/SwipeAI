# Rate limiting zone for API protection
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

upstream swipeai_backend {
    server backend:8080;
    keepalive 32;
}

# HTTP — Redirect all traffic to HTTPS (and serve Certbot ACME challenge)
server {
    listen 80;
    listen [::]:80;
    server_name blunderr.in www.blunderr.in api.blunderr.in _; # Domains

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Production Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blunderr.in www.blunderr.in api.blunderr.in; # Domains

    # SSL Certificates (Managed automatically via Certbot)
    ssl_certificate /etc/letsencrypt/live/api.blunderr.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.blunderr.in/privkey.pem;

    # SSL Security Configuration (Mozilla Modern Standard)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Maximum file upload size (for profile photos & media)
    client_max_body_size 50M;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # 1. WebSocket Endpoint for Live Real-time Chat & Signaling
    location /ws {
        proxy_pass http://swipeai_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WebSocket connection alive (24 hours idle timeout)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. Block automated vulnerability scanners & malicious probes at Nginx edge
    location ~* \.(php|asp|aspx|jsp|cgi|pl|sh|env|bak|action)$ {
        return 444;
    }

    location ~* /(cgi-bin|vendor|phpunit|solr|\.git|\.env|think) {
        return 444;
    }

    # 3. React Native Expo Web SPA (/app)
    location ^~ /app {
        alias /var/www/website/app;
        try_files $uri $uri/ /app/index.html;
    }

    # Block /admin on main domain (Admin Panel is strictly on https://admin.blunderr.in)
    location ^~ /admin {
        return 404;
    }

    # 4. Static Website Pages (Landing, Privacy, Terms, Safety, Delete Account)
    location = / {
        root /var/www/website;
        try_files /index.html =404;
    }

    location = /privacy {
        root /var/www/website;
        try_files /privacy.html =404;
    }

    location = /terms {
        root /var/www/website;
        try_files /terms.html =404;
    }

    location = /safety {
        root /var/www/website;
        try_files /safety.html =404;
    }

    location = /contact {
        root /var/www/website;
        try_files /contact.html =404;
    }

    location = /delete-account {
        root /var/www/website;
        try_files /delete-account.html =404;
    }

    # Direct high-performance static images & media serving
    location /images/ {
        root /var/www/website;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Direct high-performance application downloads (.apk, .ipa, .tar.gz, .zip)
    location /downloads/ {
        alias /var/www/website/downloads/;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Direct high-performance user uploads serving (Bypasses Spring Boot & Rate Limiting)
    location /uploads/ {
        alias /app/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Static assets caching for Expo Web SPA (/app/_expo/...) and media
    location ~* \.(webp|avif|jpg|jpeg|png|gif|ico|svg|woff2?|ttf)$ {
        root /var/www/website;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 5. REST API & Static Uploads Gateway
    location / {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://swipeai_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# Dedicated Subdomain Virtual Host: https://admin.blunderr.in
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.blunderr.in;

    ssl_certificate /etc/letsencrypt/live/admin.blunderr.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.blunderr.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    root /var/www/website/admin;
    index index.html;

    location /uploads/ {
        alias /app/uploads/;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location /v1/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://swipeai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
