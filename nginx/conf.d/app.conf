# Rate limiting zone for API protection
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

upstream swipeai_backend {
    server backend:8080;
    keepalive 32;
}

# HTTP — Redirect all traffic to HTTPS (and serve Certbot ACME challenge)
server {
    listen 80;
    listen [::]:80;
    server_name api.blunderr.in _; # Replace with your domain

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Production Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.blunderr.in; # Replace with your domain

    # SSL Certificates (Managed automatically via Certbot)
    ssl_certificate /etc/letsencrypt/live/api.blunderr.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.blunderr.in/privkey.pem;

    # SSL Security Configuration (Mozilla Modern Standard)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Maximum file upload size (for profile photos & media)
    client_max_body_size 50M;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # 1. WebSocket Endpoint for Live Real-time Chat & Signaling
    location /ws {
        proxy_pass http://swipeai_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WebSocket connection alive (24 hours idle timeout)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. REST API & Static Uploads Gateway
    location / {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://swipeai_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
