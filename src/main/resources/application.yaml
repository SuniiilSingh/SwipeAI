spring:
  application:
    name: BlunderrDating
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/swipeai}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  jackson:
    serialization:
      fail-on-empty-beans: false

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.match.SwipeAI: DEBUG
    org.springframework.security: INFO

app:
  security:
    jwt-secret: "swipeai_super_secret_jwt_key_2026_32bytes_minimum_length!"
    jwt-expiration-ms: 2592000000 # 30 days
    server-pepper: "swipeai_shadow_shield_server_pepper_salt_key_2026"
  features:
    # Feature Flags: In Default/Local profile, all external integrations default to false
    # and use the built-in high-fidelity simulated fallback functionality.
    digilocker:
      enabled: false
      api-url: "https://api.digitallocker.gov.in"
      client-id: "mock_digilocker_client"
      client-secret: "mock_digilocker_secret"
    whatsapp:
      enabled: ${FEATURE_WHATSAPP_ENABLED:false}
      api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v18.0}
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
      access-token: ${WHATSAPP_ACCESS_TOKEN:}
    twilio:
      enabled: ${FEATURE_TWILIO_ENABLED:true}
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
      api-key-sid: ${TWILIO_API_KEY_SID:}
      api-key-secret: ${TWILIO_API_KEY_SECRET:}
      phone-number: ${TWILIO_PHONE_NUMBER:}
    razorpay:
      enabled: false
      key-id: "rzp_test_mock123"
      key-secret: "mock_razorpay_secret"
      webhook-secret: "mock_webhook_secret"
    livekit:
      enabled: false
      host: "wss://livekit.example.com"
      api-key: "mock_livekit_key"
      api-secret: "mock_livekit_secret"
    ai-wingman:
      enabled: false
      api-key: "mock_openai_key"
      model: "gpt-4o-mini"
    r2-storage:
      enabled: false
      account-id: "mock_r2_account"
      access-key-id: "mock_r2_key"
      secret-access-key: "mock_r2_secret"
      bucket-name: "swipeai-media-dev"
      public-domain: "https://cdn.swipeai.in"
