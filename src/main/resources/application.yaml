spring:
  application:
    name: BlunderrDating
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/swipeai-new}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  jackson:
    serialization:
      fail-on-empty-beans: false

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.match.SwipeAI: DEBUG
    org.springframework.security: INFO

app:
  security:
    jwt-secret: "swipeai_super_secret_jwt_key_2026_32bytes_minimum_length!"
    jwt-expiration-ms: 2592000000 # 30 days
    server-pepper: "swipeai_shadow_shield_server_pepper_salt_key_2026"
    chat-encryption-key: "${CHAT_ENCRYPTION_KEY:swipeai_chat_lounge_aes256_secret_key_2026_super_secure!}"
  features:
    # Feature Flags: In Default/Local profile, all external integrations default to false
    # and use the built-in high-fidelity simulated fallback functionality.
    digilocker:
      enabled: false
      api-url: "https://api.digitallocker.gov.in"
      client-id: "mock_digilocker_client"
      client-secret: "mock_digilocker_secret"
    whatsapp:
      enabled: ${FEATURE_WHATSAPP_ENABLED:false}
      api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v18.0}
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
      access-token: ${WHATSAPP_ACCESS_TOKEN:}
    twilio:
      enabled: ${FEATURE_TWILIO_ENABLED:true}
      mock-otp: ${FEATURE_MOCK_OTP:true}
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
      api-key-sid: ${TWILIO_API_KEY_SID:}
      api-key-secret: ${TWILIO_API_KEY_SECRET:}
      phone-number: ${TWILIO_PHONE_NUMBER:}
    razorpay:
      enabled: false
      key-id: "rzp_test_mock123"
      key-secret: "mock_razorpay_secret"
      webhook-secret: "mock_webhook_secret"
    livekit:
      enabled: ${FEATURE_LIVEKIT_ENABLED:true}
      host: ${LIVEKIT_HOST:ws://localhost:7880}
      api-key: ${LIVEKIT_API_KEY:blunderr_dev_key}
      api-secret: ${LIVEKIT_API_SECRET:blunderr_super_secret_998877}
    ai-wingman:
      enabled: false
      api-key: "mock_openai_key"
      model: "gpt-4o-mini"
    r2-storage:
      enabled: ${FEATURE_R2_STORAGE_ENABLED:false}
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket-name: ${R2_BUCKET_NAME:blunderr-media}
      public-domain: ${R2_PUBLIC_DOMAIN:https://pub-f218f1444ed840668824b64cd9e1f00d.r2.dev}
